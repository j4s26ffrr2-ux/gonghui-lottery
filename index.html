<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公会抽奖</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            border-radius: 40px;
            padding: 30px 24px 40px;
            border: 1px solid #334155;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        h1 {
            text-align: center;
            color: #facc15;
            font-size: 28px;
            margin-bottom: 4px;
        }
        .sub {
            text-align: center;
            color: #94a3b8;
            font-size: 15px;
            border-bottom: 1px dashed #334155;
            padding-bottom: 20px;
            margin-bottom: 24px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            border-radius: 60px;
            padding: 14px 16px;
            margin-bottom: 28px;
            border: 1px solid #334155;
            color: #e2e8f0;
            font-weight: 500;
            text-align: center;
        }
        .stats .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stats .stat-item .num {
            font-size: 28px;
            font-weight: 700;
        }
        .stats .stat-item .num.gold {
            color: #facc15;
        }
        .stats .stat-item .num.green {
            color: #4ade80;
        }
        .stats .stat-item .label {
            font-size: 12px;
            color: #94a3b8;
        }
        .draw-area {
            text-align: center;
            margin: 20px 0 28px;
        }
        .btn-draw {
            background: #facc15;
            border: none;
            color: #0f172a;
            font-weight: 700;
            font-size: 26px;
            padding: 20px 40px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 0 #ca8a04;
            width: 100%;
            max-width: 320px;
            letter-spacing: 2px;
        }
        .btn-draw:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #ca8a04;
        }
        .btn-draw:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #ca8a04;
            pointer-events: none;
        }
        .result-box {
            background: #0f172a;
            border-radius: 20px;
            padding: 20px;
            min-height: 80px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .result-box .result-text {
            font-size: 24px;
            font-weight: 700;
            color: #e2e8f0;
        }
        .result-box .result-text.win {
            color: #facc15;
            font-size: 30px;
        }
        .result-box .result-text.lose {
            color: #94a3b8;
        }
        .result-box .sub-text {
            color: #64748b;
            font-size: 14px;
            margin-top: 6px;
        }
        .history-box {
            background: #0f172a;
            border-radius: 20px;
            padding: 16px 18px;
            border: 1px solid #2d3a4f;
        }
        .history-title {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            min-height: 28px;
        }
        .history-list .badge {
            background: #facc15;
            color: #0f172a;
            font-weight: 700;
            padding: 0 14px;
            border-radius: 40px;
            font-size: 14px;
            line-height: 28px;
        }
        .empty-history {
            color: #64748b;
            font-style: italic;
            font-size: 14px;
        }
        .footer {
            color: #475569;
            font-size: 12px;
            text-align: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #1e293b;
        }
        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
            gap: 6px;
            margin: 16px 0 20px;
        }
        .member-item {
            background: #334155;
            color: #94a3b8;
            border-radius: 30px;
            padding: 4px 0;
            text-align: center;
            font-size: 11px;
            border: 2px solid transparent;
            transition: 0.15s;
        }
        .member-item.winner {
            background: #facc15;
            color: #0f172a;
            font-weight: 700;
            border-color: #fde047;
        }
        @media (max-width: 480px) {
            .btn-draw {
                font-size: 22px;
                padding: 16px 30px;
            }
            .result-box .result-text.win {
                font-size: 24px;
            }
            .stats .stat-item .num {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎲 公会抽奖</h1>
        <div class="sub">点击抽奖 · 36 人中抽 8 人</div>

        <div class="stats">
            <div class="stat-item">
                <span class="num gold" id="winnerCount">0</span>
                <span class="label">已中奖</span>
            </div>
            <div class="stat-item">
                <span class="num green" id="remainingCount">8</span>
                <span class="label">剩余名额</span>
            </div>
            <div class="stat-item">
                <span class="num" id="totalCount">36</span>
                <span class="label">总人数</span>
            </div>
        </div>

        <div class="draw-area">
            <button class="btn-draw" id="drawBtn">🎯 抽奖</button>
        </div>

        <div class="result-box">
            <div class="result-text" id="resultText">👆 点击抽奖试试手气</div>
            <div class="sub-text" id="resultSub">每次抽取 1 人，中奖概率 1/36</div>
        </div>

        <div class="member-grid" id="memberGrid"></div>

        <div class="history-box">
            <div class="history-title">
                <span>📋 中奖名单</span>
                <span style="font-size:13px; color:#64748b;" id="historyCount">0 人</span>
            </div>
            <div class="history-list" id="historyList">
                <span class="empty-history">暂无中奖记录</span>
            </div>
        </div>
        <div class="footer">⚡ 每人限中一次 · 8 个名额抽完即止 · 刷新页面重置</div>
    </div>

    <script>
        const MEMBERS = [
            '很润', '范清川', '两只小鼠', 'AeoI菜鸟', '蓝月亮',
            '别卷了呗', '玩家25192586', '京城安少', '駶八戒', '慢慢。',
            '有点强啊我', '呆瓜王子', '昨日公园', 'KEIZUKO', '万野',
            '鱼刺！', 'mmg', '多可悲zZ', '骗氪特攻队', '辰',
            '热烈个温', '山海', '吻开', '充沛的小米', 'LLL',
            '武庸y', 'stan096712', '完美小遗忘', '178文艺青年', '秀芹。',
            '鱼仔啵啵', 'Shopt', '守护她一辈子', 'tt打怪兽', '飞鼠。',
            '楽曲'
        ];

        const MAX_WINNERS = 8;
        let winners = [];

        const gridEl = document.getElementById('memberGrid');
        const drawBtn = document.getElementById('drawBtn');
        const resultText = document.getElementById('resultText');
        const resultSub = document.getElementById('resultSub');
        const winnerCount = document.getElementById('winnerCount');
        const remainingCount = document.getElementById('remainingCount');
        const historyList = document.getElementById('historyList');
        const historyCount = document.getElementById('historyCount');

        function renderMembers() {
            gridEl.innerHTML = '';
            MEMBERS.forEach(name => {
                const div = document.createElement('div');
                div.className = 'member-item';
                if (winners.includes(name)) div.classList.add('winner');
                div.textContent = name;
                gridEl.appendChild(div);
            });
        }

        function updateStats() {
            winnerCount.textContent = winners.length;
            remainingCount.textContent = MAX_WINNERS - winners.length;
            historyCount.textContent = winners.length + ' 人';

            if (winners.length >= MAX_WINNERS) {
                drawBtn.disabled = true;
                drawBtn.textContent = '✅ 已抽完';
            } else {
                drawBtn.disabled = false;
                drawBtn.textContent = '🎯 抽奖';
            }
        }

        function updateHistory() {
            historyList.innerHTML = '';
            if (winners.length === 0) {
                historyList.innerHTML = '<span class="empty-history">暂无中奖记录</span>';
                return;
            }
            winners.forEach(name => {
                const span = document.createElement('span');
                span.className = 'badge';
                span.textContent = name;
                historyList.appendChild(span);
            });
        }

        function draw() {
            if (winners.length >= MAX_WINNERS) return;

            const available = MEMBERS.filter(m => !winners.includes(m));
            if (available.length === 0) return;

            const chosen = available[Math.floor(Math.random() * available.length)];
            winners.push(chosen);

            resultText.textContent = `🎉 恭喜 ${chosen} 获得奖励！`;
            resultText.className = 'result-text win';
            resultSub.textContent = `剩余 ${MAX_WINNERS - winners.length} 个名额`;

            renderMembers();
            updateStats();
            updateHistory();
        }

        drawBtn.addEventListener('click', draw);

        // 初始化
        renderMembers();
        updateStats();
        updateHistory();
        resultText.textContent = '👆 点击抽奖试试手气';
        resultText.className = 'result-text';
        resultSub.textContent = '每次抽取 1 人，中奖概率 1/36';
    </script>
</body>
</html>
